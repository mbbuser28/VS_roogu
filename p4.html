ProtType/Prottype3_BGM.html<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Roguelike - 1ファイルで動くローグライク</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 24px;
        }

        .main-container {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        #game-container {
            display: grid;
            grid-template-columns: repeat(20, 24px);
            grid-template-rows: repeat(15, 24px);
            gap: 1px;
            background-color: #333;
            border: 2px solid #555;
            padding: 5px;
        }

        .cell {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            background-color: #1e1e1e;
            user-select: none;
        }

        .wall { background-color: #444; }
        .floor { background-color: #1e1e1e; }

        .side-panel {
            width: 220px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .panel-box {
            background-color: #222;
            border: 1px solid #444;
            padding: 10px;
            border-radius: 5px;
        }

        .panel-box h3 {
            margin: 0 0 8px 0;
            font-size: 14px;
            border-bottom: 1px solid #555;
            padding-bottom: 4px;
            color: #ddd;
        }

        #ui-container {
            font-size: 14px;
            line-height: 1.5;
        }

        #monster-list {
            font-size: 13px;
            max-height: 200px;
            overflow-y: auto;
        }

        .monster-info-item {
            margin-bottom: 6px;
            padding-bottom: 4px;
            border-bottom: 1px dashed #333;
        }

        #message-log {
            width: 500px;
            height: 100px;
            background-color: #000;
            border: 1px solid #444;
            margin-top: 15px;
            padding: 8px;
            overflow-y: auto;
            font-size: 12px;
            color: #aaa;
            box-sizing: border-box;
        }

        .log-entry { margin-bottom: 2px; }
        .log-player { color: #81c784; }
        .log-monster { color: #e57373; }
        .log-item { color: #fff176; }
        .log-info { color: #64b5f6; }

        .controls-hint {
            margin-top: 10px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>

    <h1>Mini Roguelike</h1>

    <div class="main-container">
        <!-- ゲーム画面本体 -->
        <div>
            <div id="game-container"></div>
            <div class="controls-hint">操作: 矢印キーまたは WASD で移動 / 攻撃</div>
        </div>

        <!-- 右側ステータスパネル -->
        <div class="side-panel">
            <!-- プレイヤー情報 -->
            <div class="panel-box" id="ui-container">
                <h3>👤 プレイヤー</h3>
                <div id="player-status">HP: - / -<br>攻撃力: -<br>スコア: 0</div>
            </div>

            <!-- 右上のモンスター情報表示エリア -->
            <div class="panel-box">
                <h3>👾 周囲のモンスター</h3>
                <div id="monster-list">敵はいません</div>
            </div>
        </div>
    </div>

    <!-- ログ出力 -->
    <div id="message-log"></div>

    <script>
        const MAP_WIDTH = 20;
        const MAP_HEIGHT = 15;

        // マップ要素定数
        const TILE_WALL = 0;
        const TILE_FLOOR = 1;
        const TILE_COIN = 2;
        const TILE_STAIRS = 3;

        // モンスターの種族定義（色・記号・ステータス）
        const MONSTER_TYPES = [
            { name: 'ゴブリン', symbol: '🟢', color: '#81c784', hp: 10, maxHp: 10, atk: 3 },
            { name: 'オーク',     symbol: '🧌', color: '#ffb74d', hp: 20, maxHp: 20, atk: 5 },
            { name: 'ドラゴン', symbol: '🐉', color: '#e57373', hp: 45, maxHp: 45, atk: 12 }
        ];

        // プレイヤー定義 (人型絵文字 🚶)
        let player = {
            x: 0,
            y: 0,
            symbol: '🚶',
            hp: 30,
            maxHp: 30,
            atk: 8,
            score: 0
        };

        let map = [];
        let monsters = [];

        // 初期化
        function initGame() {
            generateMap();
            addLog("ダンジョンに入った！ (操作: 矢印キー / WASD)", "log-info");
            render();
        }

        // マップ生成
        function generateMap() {
            map = [];
            monsters = [];

            // 全体を出現不可（壁）で初期化
            for (let y = 0; y < MAP_HEIGHT; y++) {
                let row = [];
                for (let x = 0; x < MAP_WIDTH; x++) {
                    row.push(TILE_WALL);
                }
                map.push(row);
            }

            // 床の生成（簡易掘削法）
            for (let y = 1; y < MAP_HEIGHT - 1; y++) {
                for (let x = 1; x < MAP_WIDTH - 1; x++) {
                    if (Math.random() > 0.25) {
                        map[y][x] = TILE_FLOOR;
                    }
                }
            }

            // プレイヤー位置の設定（床のある場所へ）
            let placedPlayer = false;
            while (!placedPlayer) {
                let px = Math.floor(Math.random() * (MAP_WIDTH - 2)) + 1;
                let py = Math.floor(Math.random() * (MAP_HEIGHT - 2)) + 1;
                if (map[py][px] === TILE_FLOOR) {
                    player.x = px;
                    player.y = py;
                    placedPlayer = true;
                }
            }

            // 点数アイテム（コイン）配置 - 出現率を低く設定 (約1.5%確率)
            for (let y = 1; y < MAP_HEIGHT - 1; y++) {
                for (let x = 1; x < MAP_WIDTH - 1; x++) {
                    if (map[y][x] === TILE_FLOOR && !(x === player.x && y === player.y)) {
                        if (Math.random() < 0.015) { // 低出現率
                            map[y][x] = TILE_COIN;
                        }
                    }
                }
            }

            // モンスター複数体の配置 (3〜5体)
            let monsterCount = Math.floor(Math.random() * 3) + 3;
            while (monsters.length < monsterCount) {
                let mx = Math.floor(Math.random() * (MAP_WIDTH - 2)) + 1;
                let my = Math.floor(Math.random() * (MAP_HEIGHT - 2)) + 1;

                if (map[my][mx] === TILE_FLOOR && !(mx === player.x && my === player.y) && !getMonsterAt(mx, my)) {
                    // 出現確率調整 (ゴブリン高確率、ドラゴンレア)
                    let rand = Math.random();
                    let typeIdx = 0;
                    if (rand > 0.85) typeIdx = 2;      // ドラゴン (15%)
                    else if (rand > 0.50) typeIdx = 1; // オーク (35%)

                    let type = MONSTER_TYPES[typeIdx];
                    monsters.push({
                        x: mx,
                        y: my,
                        name: type.name,
                        symbol: type.symbol,
                        color: type.color,
                        hp: type.hp,
                        maxHp: type.maxHp,
                        atk: type.atk
                    });
                }
            }
        }

        // 座標からモンスター取得
        function getMonsterAt(x, y) {
            return monsters.find(m => m.x === x && m.y === y);
        }

        // プレイヤー移動・行動処理
        function movePlayer(dx, dy) {
            if (player.hp <= 0) return;

            let newX = player.x + dx;
            let newY = player.y + dy;

            // 画面外・壁チェック
            if (newX < 0 || newX >= MAP_WIDTH || newY < 0 || newY >= MAP_HEIGHT) return;
            if (map[newY][newX] === TILE_WALL) return;

            // モンスター攻撃判定
            let targetMonster = getMonsterAt(newX, newY);
            if (targetMonster) {
                // 攻撃
                targetMonster.hp -= player.atk;
                addLog(`${player.symbol} が ${targetMonster.name} に ${player.atk} のダメージ！`, "log-player");

                if (targetMonster.hp <= 0) {
                    addLog(`${targetMonster.name} を倒した！`, "log-info");
                    monsters = monsters.filter(m => m !== targetMonster);
                    player.score += 100;
                }
            } else {
                // 移動
                player.x = newX;
                player.y = newY;

                // コイン拾い
                if (map[newY][newX] === TILE_COIN) {
                    map[newY][newX] = TILE_FLOOR;
                    player.score += 50;
                    addLog(`💰 点数アイテムを獲得！ (+50pt)`, "log-item");
                }
            }

            // ターン経過（モンスター行動）
            updateMonsters();
            render();
        }

        // モンスターのターン行動
        function updateMonsters() {
            monsters.forEach(m => {
                let dx = 0;
                let dy = 0;

                // プレイヤーに近寄る簡単なAI
                if (m.x < player.x) dx = 1;
                else if (m.x > player.x) dx = -1;

                if (m.y < player.y) dy = 1;
                else if (m.y > player.y) dy = -1;

                // 縦横交互に優先
                if (Math.random() < 0.5) dy = 0;
                else dx = 0;

                let nextX = m.x + dx;
                let nextY = m.y + dy;

                // プレイヤーへの攻撃判定
                if (nextX === player.x && nextY === player.y) {
                    player.hp -= m.atk;
                    addLog(`${m.symbol} ${m.name} の攻撃！ ${m.atk} のダメージを受けた！`, "log-monster");

                    if (player.hp <= 0) {
                        player.hp = 0;
                        addLog(`💀 プレイヤーは倒れた... GAME OVER`, "log-monster");
                    }
                } else if (map[nextY][nextX] === TILE_FLOOR && !getMonsterAt(nextX, nextY)) {
                    // 移動
                    m.x = nextX;
                    m.y = nextY;
                }
            });
        }

        // ログ出力関数
        function addLog(text, className = "") {
            const logBox = document.getElementById('message-log');
            const entry = document.createElement('div');
            entry.className = `log-entry ${className}`;
            entry.innerText = text;
            logBox.appendChild(entry);
            logBox.scrollTop = logBox.scrollHeight;
        }

        // 描画処理
        function render() {
            const container = document.getElementById('game-container');
            container.innerHTML = '';

            // マップ & ユニット描画
            for (let y = 0; y < MAP_HEIGHT; y++) {
                for (let x = 0; x < MAP_WIDTH; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';

                    let monster = getMonsterAt(x, y);

                    if (x === player.x && y === player.y) {
                        cell.innerText = player.symbol; // 🚶 人型
                        cell.classList.add('floor');
                    } else if (monster) {
                        cell.innerText = monster.symbol;
                        cell.style.color = monster.color;
                        cell.classList.add('floor');
                    } else if (map[y][x] === TILE_WALL) {
                        cell.classList.add('wall');
                    } else if (map[y][x] === TILE_COIN) {
                        cell.innerText = '🪙';
                        cell.classList.add('floor');
                    } else {
                        cell.innerText = '．';
                        cell.style.color = '#333';
                        cell.classList.add('floor');
                    }

                    container.appendChild(cell);
                }
            }

            // プレイヤーUI更新
            document.getElementById('player-status').innerHTML = `
                ${player.symbol} HP: ${player.hp} / ${player.maxHp}<br>
                ⚔️ 攻撃力: ${player.atk}<br>
                🏆 スコア: ${player.score}
            `;

            // 右上モンスターリスト表示更新
            const monsterListEl = document.getElementById('monster-list');
            monsterListEl.innerHTML = '';

            if (monsters.length === 0) {
                monsterListEl.innerHTML = '<span style="color: #666;">(全滅しました)</span>';
            } else {
                monsters.forEach(m => {
                    const item = document.createElement('div');
                    item.className = 'monster-info-item';
                    item.innerHTML = `
                        <span style="color:${m.color}">${m.symbol} <strong>${m.name}</strong></span><br>
                        HP: ${m.hp}/${m.maxHp} | 攻撃力: ${m.atk}
                    `;
                    monsterListEl.appendChild(item);
                });
            }
        }

        // キー入力受取
        window.addEventListener('keydown', (e) => {
            switch (e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    movePlayer(0, -1);
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    movePlayer(0, 1);
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    movePlayer(-1, 0);
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    movePlayer(1, 0);
                    break;
            }
        });

        // 起動
        initGame();
    </script>
</body>
</html>
